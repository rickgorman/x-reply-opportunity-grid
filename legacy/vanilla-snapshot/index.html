<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>X Reply Dashboard</title>
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M8 7h5l11 18h-5zM23 7 8 25' fill='none' stroke='%23e7e9ea' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Reply opportunity dashboard home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="1.5" fill="currentColor" opacity=".55"/><rect x="3" y="13" width="8" height="8" rx="1.5" fill="currentColor" opacity=".55"/><rect x="13" y="13" width="8" height="8" rx="1.5" fill="currentColor"/></svg>
        <span>Reply dashboard</span>
        <span class="version">v3</span>
      </a>
      <div class="session-info"><span class="status-dot" aria-hidden="true"></span> Local preview</div>
    </header>

    <main>
      <div class="feed-toolbar">
        <div class="feed-label">For you <span id="total-count" class="count">—</span></div>
        <div class="source-legend" aria-label="Sources">
          <span><i class="legend-dot feed-dot" aria-hidden="true"></i> Feed <b id="feed-count">—</b></span>
          <span><i class="legend-dot candidate-dot" aria-hidden="true"></i> Candidates <b id="candidate-count">—</b></span>
        </div>
      </div>

      <p id="load-status" class="notice" role="status">Loading conversations…</p>
      <p id="storage-status" class="notice" role="status" hidden></p>
      <noscript><p class="notice">Enable JavaScript to browse the local tweet fixtures.</p></noscript>
      <section id="tweet-grid" class="tweet-grid" aria-label="Tweets worth replying to" aria-busy="true"></section>
      <footer class="page-footer"><span>Fictional sample posts · Your place is saved in this browser.</span><span>A wider view of the conversation <span aria-hidden="true">↗</span></span></footer>
    </main>
  </body>
</html>
